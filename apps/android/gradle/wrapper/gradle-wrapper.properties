distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 华为云镜像（2026-10-10 双机协作）：services.gradle.org 在大陆直连经常超时/断流。
# 镜像文件与官方逐字节一致，且下方 distributionSha256Sum 与官方 .sha256 相同——
# 若镜像内容被篡改或损坏，wrapper 校验直接失败，不会静默使用坏包。
# 官方地址备查：https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.11.1-bin.zip
distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
# 默认 10000ms 对镜像偶发慢响应过紧；重试 3 次提升首次同步成功率。
networkTimeout=60000
retries=3
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
