org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 桌面端打包（jpackage）的 JDK 厂商检查：Compose 官方只认 Temurin/Corretto/Zulu 等，
# Homebrew 的 openjdk@17（本机开发机装的）会被直接拒绝。开发机上关掉这项检查是为了能本地
# 验证打包链路本身；**对外发布的安装包一律由 CI 用 Temurin 构建**（那里这项检查本来就会通过），
# 免得把开发机 Homebrew 的运行时打进产物。
compose.desktop.packaging.checkJdkVendor=false
