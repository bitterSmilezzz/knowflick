name: Workbench Release

# ⛔ 这里**故意**只剩一个占位 job：Go 打包（DMG/MSI/DEB）尚未就绪。
#
# 为什么暂停：
#   - Tauri 三平台打包已不可用——Rust 壳已随 ADR-0042（移除 Tauri/Rust）从工作树删除，
#     三台 runner 各出一个安装包的那套矩阵也失去了依据；
#   - Go 后端（apps/workbench-go，Wails v3 单一二进制）目前只有 tools/build_workbench_go.sh 产**本机可执行文件**，
#     还没有 DMG / MSI / DEB 的打包与校验方案；
#   - 与其留着一条注定红或静默产出残缺附件的打包线，不如显式停掉（红得清楚，比假绿安全）。
#
# 恢复条件（三条都满足才把真实的 package/release job 加回来）：
#   1. Wails v3（或等价方案）能在 macOS / Windows / Linux 各产出一个确定的安装包格式，
#      且 tools/build_workbench_go.sh 或后继脚本在 CI 上可复现；
#   2. 三平台 runner 上能实际跑通「构建 → 产物存在性/最低系统版本校验 → 留档」；
#   3. docs/adr/0042-remove-tauri-rust.md 记录新发布口径（产物命名、tag 规则、Release 附件清单）。
#
# ⚠️ 触发面只有 workflow_dispatch：**打 `workbench-v*` tag 不会触发这条 workflow，也不会产出任何附件**。
# 旧版本的自动发版靠 tag 推送；现在 tag 一律不触发，避免「打了 tag、界面静默、以为在打包」的误解。
# 需要发版时先满足上面的恢复条件，再把 tag 触发（连同 paths 说明）加回来。
#
# 需要本机可执行文件时：`./tools/build_workbench_go.sh`（Wails v3 单二进制，不做安装包）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  not-ready:
    name: 打包方案未就绪（占位）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 说明并失败（占位 job，不是可用的发布通道）
        run: |
          message='Go 打包（DMG/MSI/DEB）尚未就绪，见 docs/adr/0042-remove-tauri-rust.md；本轮请用 tools/build_workbench_go.sh 构建本机可执行文件'
          # 注解让失败原因直接出现在 Actions 的报错摘要里；公开仓库读不到 job 日志，只能靠注解。
          echo "::error::$message"
          echo "$message" >&2
          exit 1
