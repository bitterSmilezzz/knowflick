name: Android instrumented

# Android 仪器测试（34 项：导航回归 / ReleaseReadiness / 凭据持久化 / 语音通道 / 卡堆）此前
# 只在本地 AVD 上跑，是最大的回归敞口。CI 化路径选型（kvm-probe 2026-09-30 定案）：
#   · 标准 Linux runner 不暴露 /dev/kvm，Gradle Managed Devices 与模拟器都跑不动 → 排除；
#   · 本仓库是公共仓库，标准 runner 分钟免费 → 用 macOS ARM runner：arm64 模拟器镜像经
#     Hypervisor.framework 原生运行，不需要 KVM，也不产生费用。
# 因此这里用 macos-14 + arm64 镜像跑 connectedDebugAndroidTest，与 android.yml（JVM 测试 +
# 构建）互补：JVM 管纯逻辑回归，本工作流管真实设备行为（导航、凭据、生命周期）。
#
# 注意：镜像下载（约 1.2 GB）+ 模拟器启动 + 34 项测试 ≈ 10-20 分钟，比 JVM 测试慢得多，
# 故与 android.yml 分开成两个工作流，避免拖慢普通构建反馈。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/android/**'
      - 'shared/**'
      - '.github/workflows/android-instrumented.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'shared/**'
      - '.github/workflows/android-instrumented.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: 准备 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 arm64 模拟器镜像
        # macos-14 自带 Android SDK（ANDROID_HOME 已设），只需补齐模拟器与镜像。
        # 选 google_apis 而非 android-atd：ATD 镜像只有 x86_64，ARM runner 上跑不动。
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'emulator' 'system-images;android-35;google_apis;arm64-v8a'

      - name: Gradle 缓存
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 运行仪器测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          # macOS runner 上 adb daemon 不会自启：模拟器启动时连不上 5037（首跑日志唯一的
          # ERROR 行），设备永远注册不进 adb，轮询必然超时。启动前先把 server 拉起来。
          pre-emulator-launch-script: adb start-server
          script: cd apps/android && ./gradlew --console=plain :app:connectedDebugAndroidTest

      - name: 上传测试报告（失败现场）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports${{ job.status != 'success' && '-failed' || '' }}
          path: apps/android/app/build/outputs/androidTest-results/**
          retention-days: 14
