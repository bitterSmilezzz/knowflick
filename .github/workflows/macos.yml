name: macOS

# mac 端在云端构建：本地只有 CommandLineTools 时，SwiftUI 宏无法展开，
# 而 GitHub 的 macOS runner 自带完整 Xcode。公开仓库的 macOS runner 免费。
#
# 触发方式：
#   1. 推送到 main 且改动涉及 mac 端 / 共享资产 / 工具 → 验证构建，产物留在 Artifacts；
#   2. 推送 v* tag（如 v4.2.0）→ 构建并把 zip 与校验和附到对应 Release；
#   3. 手动触发（Actions → macOS → Run workflow）。
# 说明：默认 token 可能没有 workflow 触发权限，main 分支触发是不依赖该权限的验证路径。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mac/**'
      - 'shared/**'
      - 'tools/**'
      - '.github/workflows/macos.yml'
    tags:
      - 'v*'

permissions:
  contents: write   # tag 构建时需要上传 Release 资产

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: 显示工具链版本
        run: |
          xcodebuild -version
          swift --version
          echo "---"
          ls /Applications | grep -i xcode || true

      - name: 运行 Swift 测试
        run: ./tools/test.sh

      - name: 打包 KnowFlick.app
        run: cd apps/mac && ./build_app.sh

      - name: 校验产物结构
        run: |
          set -euo pipefail
          APP=dist/KnowFlick.app
          test -x "$APP/Contents/MacOS/KnowFlick" || { echo "缺少可执行文件"; exit 1; }
          codesign --verify --deep --strict "$APP"
          BUNDLE="$APP/Contents/Resources/KnowFlick_KnowFlickCore.bundle"
          test -d "$BUNDLE" || { echo "缺少资源 bundle"; exit 1; }
          SEED="$BUNDLE/Contents/Resources/seed_cards.json"
          test -f "$SEED" || { echo "缺少种子卡"; exit 1; }
          COUNT=$(python3 -c "import json;print(len(json.load(open('$SEED'))))")
          IMAGES=$(ls "$BUNDLE/Contents/Resources/"*.webp 2>/dev/null | wc -l | tr -d ' ')
          echo "种子卡 $COUNT 张；底图 $IMAGES 张"
          test "$COUNT" -ge 200 || { echo "种子卡数量异常"; exit 1; }
          test "$IMAGES" -eq 42 || { echo "底图数量异常（应为 42）"; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "版本 $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 收集产物
        run: |
          set -euo pipefail
          # ditto 保留符号链接、权限与扩展属性；zip 命令会把 .app 打坏
          ditto -c -k --sequesterRsrc --keepParent \
            dist/KnowFlick.app "dist/KnowFlick-${VERSION}.app.zip"
          shasum -a 256 "dist/KnowFlick-${VERSION}.app.zip" \
            | tee "dist/KnowFlick-${VERSION}.app.zip.sha256"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: KnowFlick-${{ env.VERSION }}
          path: |
            dist/KnowFlick-*.app.zip
            dist/KnowFlick-*.app.zip.sha256
          retention-days: 30

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/KnowFlick-${VERSION}.app.zip" \
              "dist/KnowFlick-${VERSION}.app.zip.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "KnowFlick $GITHUB_REF_NAME" \
              --generate-notes \
              "dist/KnowFlick-${VERSION}.app.zip" \
              "dist/KnowFlick-${VERSION}.app.zip.sha256"
          fi
