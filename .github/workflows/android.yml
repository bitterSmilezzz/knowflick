name: Android

# android 端在 Linux runner 上构建：不需要 Xcode，比 macOS runner 更快。
#
# 触发方式：
#   1. 推送到 main 且改动涉及 android 端 / 共享资产 / 工具 → 单测 + Lint + APK 构建；
#   2. 对 main 的 pull request（同样的路径过滤）→ 合并前就能看到结果；
#   3. 手动触发。
#
# 关于发布包：这里产出两个包，都不是发布物。debug APK 用 SDK 自带调试证书；release APK
# 在没有 signing.properties 时是未签名包——加它不需要任何密钥，但能覆盖只在 release 路径
# 生效的 R8、资源压缩与 baseline profile 合并（0.8.0 那次 Tink 注解缺陷就只在 R8 阶段暴露）。
# 正式发布用的签名包需要 keystore，属敏感凭据，需另行通过 GitHub Secrets 注入。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/android/**'
      - 'shared/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - 'shared/**'
      - 'tools/**'
      - '.github/workflows/android.yml'

# 同一分支上只保留最新一次运行：连续推送时取消上一次未完成的构建。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v4 起默认 cmdline-tools 由 16.0 升到 20.0（旧默认「取最新版本号下载」已因
      # Google 要求先接受条款而 404）。若将来遇到 sdkmanager 相关解析问题，
      # 可加 with: cmdline-tools-version: 12266719 回退。
      #
      # 2026-09-16：v4 的默认 packages（`tools platform-tools`）中 `tools` 已从
      # Google SDK 仓库下架，sdkmanager 20.0 报 `Failed to find package 'tools'`
      # 且 exit 1（runner 镜像与 SDK 仓库更新的组合问题，与项目代码无关）。
      # 显式只装真实存在的 platform-tools；platforms/build-tools 由 Gradle
      # 在构建时按需下载（licenses 已在 action 内接受）。
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: 缓存 Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 显示工具链版本
        run: |
          java -version
          cd apps/android && ./gradlew --version

      - name: 检查 shell 脚本陷阱
        run: ./tools/lint_shell_vars.sh

      - name: 校验学科契约与内容
        # 学科体系有三处事实来源：shared/assets/taxonomy_map.json、mac 与 Android 各自内嵌的
        # SubjectRegistry。这里先做契约自洽 + 种子内容合法 + 三处一致的粗校验，
        # 双端逐字段的等价性仍由各自的单测保证（那两层缺一不可）。
        run: python3 tools/check_taxonomy.py

      - name: 单元测试与 Lint
        run: |
          cd apps/android
          ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug

      - name: 汇总测试结果
        if: always()
        run: |
          cd apps/android
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failed += int(root.get('failures', 0)) + int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          print(f'JVM 测试：{total} 项，失败 {failed}，跳过 {skipped}')
          sys.exit(1 if failed else 0)
          PY

      - name: 构建 debug 与 release APK
        run: |
          cd apps/android
          # release 路径才有 R8、资源压缩与 baseline profile 合并，debug 构建永远看不到
          # 那一类缺陷；没有 signing.properties 时产出未签名包，无需任何密钥。
          ./gradlew --console=plain :app:assembleDebug :app:assembleRelease

      - name: 校验 APK 内容
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          # 期望值从共享资产源头现算，不写死 42/214：底图或种子卡一增删，mac 与 android
          # 两条 workflow 会同时变红，而失败信息看起来像「产物坏了」，会误导排查方向。
          EXPECT_IMAGES=$(ls shared/assets/bg/*.webp 2>/dev/null | wc -l | tr -d ' ' || true)
          EXPECT_SEEDS=$(python3 -c "import json;print(len(json.load(open('shared/assets/seed_cards.json'))))" 2>/dev/null || echo 0)
          SRC_SEED_SHA=$(shasum -a 256 shared/assets/seed_cards.json | cut -d' ' -f1)
          test "$EXPECT_IMAGES" -gt 0 || { echo "::error::shared/assets 下没有底图"; exit 1; }
          test "$EXPECT_SEEDS" -gt 0 || { echo "::error::shared/assets/seed_cards.json 为空"; exit 1; }

          # 共享资源应来自仓库根 shared/assets（android 侧由 assets.srcDirs 指向）。
          # release 包走 R8 与资源压缩，资源有被误删的可能，因此两个包都要验。
          check_apk() {
            local apk="$1" label="$2" seeds images sha
            test -f "$apk" || { echo "::error::缺少 ${label}：$apk"; exit 1; }
            seeds=$(unzip -l "$apk" | grep -c 'assets/seed_cards.json' || true)
            images=$(unzip -l "$apk" | grep -c 'assets/bg/.*\.webp' || true)
            echo "${label}：种子卡 $seeds 份；底图 $images 张（源头底图 $EXPECT_IMAGES 张、种子卡 $EXPECT_SEEDS 张）"
            test "$seeds" -eq 1 || { echo "::error::${label} 内应有且仅有 1 份种子卡，实际 $seeds"; exit 1; }
            test "$images" -eq "$EXPECT_IMAGES" || { echo "::error::${label} 内底图 $images 张，与 shared/assets 的 $EXPECT_IMAGES 张不一致"; exit 1; }
            sha=$(unzip -p "$apk" assets/seed_cards.json | shasum -a 256 | cut -d' ' -f1)
            test "$sha" = "$SRC_SEED_SHA" || { echo "::error::${label} 内种子卡与 shared/assets 源文件不一致"; exit 1; }
          }
          check_apk "$APK" "debug APK"
          RELEASE_APK=$(ls apps/android/app/build/outputs/apk/release/app-release*.apk 2>/dev/null | head -1 || true)
          check_apk "$RELEASE_APK" "release APK"

          META=apps/android/app/build/outputs/apk/debug/output-metadata.json
          VERSION=$(python3 -c "import json;print(json.load(open('$META'))['elements'][0]['versionName'])")
          VERSION_CODE=$(python3 -c "import json;print(json.load(open('$META'))['elements'][0]['versionCode'])")
          SIZE=$(stat -c %s "$APK")
          # 变量名一律用 ${} 界定：紧跟全角标点时，bash 会把其首字节并进变量名
          echo "版本 ${VERSION}（versionCode ${VERSION_CODE}），${SIZE} 字节"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # 失败时也要留下现场。注意单测或 Lint 失败时 APK 根本不会产出，所以现场是测试
      # 报告本身；这些都是诊断材料，不是发布物（正式发布包由本地 tools/build_android.sh
      # 产出），artifact 名带 -failed 后缀以免把失败运行的半成品当成可发布的包。
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: KnowFlick-android-${{ env.VERSION || 'unknown' }}-test-reports${{ job.status != 'success' && '-failed' || '' }}
          path: |
            apps/android/app/build/reports/tests/**
            apps/android/app/build/test-results/**
            apps/android/app/build/reports/lint-results-*.html
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: KnowFlick-android-${{ env.VERSION || 'unknown' }}${{ job.status != 'success' && '-failed' || '' }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/release/app-release*.apk
          retention-days: 30
