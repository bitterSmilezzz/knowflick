name: Desktop (Windows / macOS / Linux)

# 「一套开发，多处发布」的发布通道：同一份代码（:desktop + :shared-ui + :domain）
# 在三个系统上各跑一次测试并各打一个原生安装包。
#
# 为什么必须是三台机器：jpackage **不支持交叉编译**，DMG 只能在 macOS 出、MSI 只能在 Windows 出、
# DEB 只能在 Linux 出。所以这里是「一份配置 × 三台机器」，不是三套配置。
#
# 关键设计：这一步**不装 Android SDK**，并显式清空 ANDROID_HOME / ANDROID_SDK_ROOT——
# 若仍然构建通过，就等于在 CI 上再证一次「桌面端独立于 Android 工具链」这条结论。
# 触发的路径过滤只包含桌面端依赖的模块，改 Android 壳不会白白烧三台机器的额度。
# 注意：paths 过滤**对 tag 推送不生效**（GitHub 官方文档："Path filters are not evaluated for
# pushes of tags"），所以 desktop-v* tag 即使打在只改文档的提交上也会照常构建并发布——
# 这是我们要的语义，别为了「省额度」把 tag 拆到另一个 workflow 里去。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'
    paths:
      - 'apps/android/desktop/**'
      - 'apps/android/shared-ui/**'
      - 'apps/android/domain/**'
      - 'apps/android/shared-data/**'
      - 'apps/android/build.gradle.kts'
      - 'apps/android/settings.gradle.kts'
      - 'apps/android/gradle.properties'
      - 'apps/android/gradle/**'
      - 'apps/android/gradlew'
      - 'apps/android/gradlew.bat'
      - 'shared/assets/**'
      - 'shared/icons/**'
      - 'tools/ci_gradle_official_source.sh'
      - 'tools/test_desktop_ci_triggers.py'
      - 'tools/check_tauri_permissions.py'
      - 'tools/check_rust_error_messages.py'
      - 'tools/test_check_frontend_error_text.py'
      - 'tools/check_frontend_error_text.py'
      - 'tools/test_windows_console.py'
      - 'tools/windows_console.py'
      - 'tools/test_check_rust_error_messages.py'
      - 'tools/test_check_tauri_permissions.py'
      - 'tools/workflow_paths.py'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/android/desktop/**'
      - 'apps/android/shared-ui/**'
      - 'apps/android/domain/**'
      - 'apps/android/shared-data/**'
      - 'apps/android/build.gradle.kts'
      - 'apps/android/settings.gradle.kts'
      - 'apps/android/gradle.properties'
      - 'apps/android/gradle/**'
      - 'apps/android/gradlew'
      - 'apps/android/gradlew.bat'
      - 'shared/assets/**'
      - 'shared/icons/**'
      - 'tools/ci_gradle_official_source.sh'
      - 'tools/test_desktop_ci_triggers.py'
      - '.github/workflows/desktop.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (deb)
            format: deb
            task: packageDeb
          - os: macos-latest
            label: macOS (dmg)
            format: dmg
            task: packageDmg
          - os: windows-latest
            label: Windows (msi)
            format: msi
            task: packageMsi
    env:
      # 见文件头：显式清掉 Android SDK 环境，用构建结果证明桌面端不依赖它。
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
    steps:
      - uses: actions/checkout@v7

      - name: 校验桌面依赖变更会触发 CI
        shell: bash
        run: python3 -m unittest discover -s tools -p test_desktop_ci_triggers.py

      # Tauri 命令 / build.rs 声明 / capability 授权必须三处一致。
      # 少一处 → 前端调用被 ACL 拒绝，或打包直接失败（Permission xxx not found）。
      # 浏览器冒烟测不到这个：浏览器模式根本不走 Tauri。
      - name: 校验 Tauri 命令与权限一致
        shell: bash
        run: python3 tools/check_tauri_permissions.py

      - name: 校验面向用户的错误消息是中文
        shell: bash
        run: python3 tools/check_rust_error_messages.py

      - name: 校验前端错误展示有中文兜底
        shell: bash
        run: python3 tools/check_frontend_error_text.py

      - name: 配置 JDK 17（Temurin —— 也是打包用的厂商，见 gradle.properties 的说明）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle.properties', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: desktop-${{ runner.os }}-

      # CI runner 在美国，wrapper 却要去撞国内镜像——2026-10-23 真出过
      # 「Verification of Gradle distribution failed」（镜像字节与官方校验和不符）。
      # 依赖源已经按 CI 环境分流（settings.gradle.kts），wrapper 这层补上。
      # 校验和保持不变：官方源被篡改一样会被 wrapper 拒绝。
      - name: Gradle wrapper 改用官方源
        # 必须显式指定 bash：Windows runner 默认 shell 是 PowerShell，
        # 而 .sh 脚本在 PowerShell 里**不会报错也不会执行**——步骤照样「成功」，
        # 改写没发生，CI 继续用国内镜像。静默少跑，最坑的一种。
        shell: bash
        run: ./tools/ci_gradle_official_source.sh

      - name: 共享模块测试 + 打本系统安装包
        shell: bash
        run: |
          cd apps/android
          # Linux runner 没有 X11；测试内部已设 java.awt.headless=true，有 xvfb 就再兜一层。
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a ./gradlew --console=plain \
              :domain:jvmTest :shared-ui:jvmTest :shared-data:jvmTest :desktop:test :desktop:${{ matrix.task }}
          else
            ./gradlew --console=plain \
              :domain:jvmTest :shared-ui:jvmTest :shared-data:jvmTest :desktop:test :desktop:${{ matrix.task }}
          fi

      - name: 校验产物存在
        shell: bash
        run: |
          cd apps/android/desktop/build/compose/binaries/main/${{ matrix.format }}
          ls -la
          test -n "$(ls -A)" || { echo "::error::没有产出 ${{ matrix.format }} 安装包"; exit 1; }

      # jpackage 的 stderr 只写进 build/compose/logs 下的文件，不 dump 的话 CI 只会给一句
      # 「External tool execution failed」，无从下手。与 macos.yml「失败时也要留下现场」同一纪律。
      - name: 打包失败时留现场
        if: failure()
        shell: bash
        run: |
          for f in $(find apps/android/desktop/build/compose/logs -type f 2>/dev/null); do
            echo "================ $f"
            cat "$f"
          done

      - name: 失败时上传 jpackage 日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.format }}-jpackage-logs
          path: apps/android/desktop/build/compose/logs/**
          retention-days: 7
          if-no-files-found: ignore

      # PR 上只构建不存档（安装包 60MB 上下，三系统存档会白烧配额）；
      # 推 main 或打 tag 时才留档，便于回看与发版。
      - name: 留档安装包
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.format }}
          path: apps/android/desktop/build/compose/binaries/main/${{ matrix.format }}/*
          retention-days: 7

  release:
    name: 附到 Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 取回三个安装包
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: false

      # 命名映射 / 校验和 / 版本校验 / 发布都在脚本里，workflow 不重复实现一遍：
      # 这条通道**只在打 tag 时走**，把逻辑放进可本地空跑的脚本，比藏在 YAML 里可验证得多
      #（本地：tools/assemble_desktop_release.sh --tag desktop-v0.1.0 --artifacts-dir <目录>）。
      - name: 组装附件并附到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/assemble_desktop_release.sh --publish
