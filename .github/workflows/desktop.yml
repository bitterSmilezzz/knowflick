name: Desktop (Windows / macOS / Linux)

# 「一套开发，多处发布」的发布通道：同一份代码（:desktop + :shared-ui + :domain）
# 在三个系统上各跑一次测试并各打一个原生安装包。
#
# 为什么必须是三台机器：jpackage **不支持交叉编译**，DMG 只能在 macOS 出、MSI 只能在 Windows 出、
# DEB 只能在 Linux 出。所以这里是「一份配置 × 三台机器」，不是三套配置。
#
# 关键设计：这一步**不装 Android SDK**，并显式清空 ANDROID_HOME / ANDROID_SDK_ROOT——
# 若仍然构建通过，就等于在 CI 上再证一次「桌面端独立于 Android 工具链」这条结论。
# 触发的路径过滤只包含桌面端依赖的模块，改 Android 壳不会白白烧三台机器的额度。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'
    paths:
      - 'apps/android/desktop/**'
      - 'apps/android/shared-ui/**'
      - 'apps/android/domain/**'
      - 'apps/android/gradle.properties'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/android/desktop/**'
      - 'apps/android/shared-ui/**'
      - 'apps/android/domain/**'
      - 'apps/android/gradle.properties'
      - '.github/workflows/desktop.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (deb)
            format: deb
            task: packageDeb
          - os: macos-latest
            label: macOS (dmg)
            format: dmg
            task: packageDmg
          - os: windows-latest
            label: Windows (msi)
            format: msi
            task: packageMsi
    env:
      # 见文件头：显式清掉 Android SDK 环境，用构建结果证明桌面端不依赖它。
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
    steps:
      - uses: actions/checkout@v7

      - name: 配置 JDK 17（Temurin —— 也是打包用的厂商，见 gradle.properties 的说明）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle.properties', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: 共享模块测试 + 打本系统安装包
        shell: bash
        run: |
          cd apps/android
          # Linux runner 没有 X11；测试内部已设 java.awt.headless=true，有 xvfb 就再兜一层。
          if command -v xvfb-run >/dev/null 2>&1; then
            xvfb-run -a ./gradlew --console=plain \
              :domain:jvmTest :shared-ui:jvmTest :desktop:test :desktop:${{ matrix.task }}
          else
            ./gradlew --console=plain \
              :domain:jvmTest :shared-ui:jvmTest :desktop:test :desktop:${{ matrix.task }}
          fi

      - name: 校验产物存在
        shell: bash
        run: |
          cd apps/android/desktop/build/compose/binaries/main/${{ matrix.format }}
          ls -la
          test -n "$(ls -A)" || { echo "::error::没有产出 ${{ matrix.format }} 安装包"; exit 1; }

      # PR 上只构建不存档（安装包 60MB 上下，三系统存档会白烧配额）；
      # 推 main 或打 tag 时才留档，便于回看与发版。
      - name: 留档安装包
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.format }}
          path: apps/android/desktop/build/compose/binaries/main/${{ matrix.format }}/*
          retention-days: 7

  release:
    name: 附到 Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 校验 tag 与配置里的版本一致
        run: |
          set -euo pipefail
          # 与 macos.yml 同一条纪律：tag 与产物版本不符时，下载者拿到名不副实的安装包且事后难察觉。
          # 取第一处 packageVersion（macOS 块里那个是 jpackage 要求的 MAJOR>0 别名，不是产品版本）。
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          CONFIGURED="$(grep -m1 'packageVersion = ' apps/android/desktop/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$VERSION" != "$CONFIGURED" ]; then
            echo "::error::tag 里的版本 $VERSION 与 build.gradle.kts 的 packageVersion $CONFIGURED 不一致"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME 与配置版本一致：$VERSION"

      - name: 取回三个安装包
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: false

      - name: 统一命名并附到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          mkdir -p out
          # jpackage 的 macOS/Windows 内部版本要求 MAJOR>0，产物文件名会是 KnowFlick-1.0.0.*；
          # 对外统一用**产品版本**（tag 里的 0.1.0），命名规则对齐 mac/android 的产物习惯。
          cp desktop-dmg/*.dmg   "out/KnowFlick-$VERSION-macos.dmg"
          cp desktop-msi/*.msi   "out/KnowFlick-$VERSION-windows.msi"
          cp desktop-deb/*.deb   "out/KnowFlick-$VERSION-linux.deb"
          (cd out && shasum -a 256 * > SHA256SUMS.txt)
          ls -la out

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* \
              --title "KnowFlick Desktop $VERSION" \
              --notes "同一份代码在 Windows / macOS / Linux 三处发布（见 docs/adr/0001）。安装包由三台 runner 各自构建：jpackage 不支持交叉编译。"
          fi
