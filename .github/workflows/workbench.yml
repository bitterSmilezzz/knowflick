  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/workbench/**'
      - 'apps/android/domain/src/jvmAndAndroidMain/kotlin/com/knowflick/app/domain/WebClipEngine.kt'
      - 'shared/assets/**'
      - 'tools/verify_workbench.sh'
      - 'tools/check_clip_parity.py'
      # 门禁实际调用的脚本——改了它们却不触发 CI，等于改完没人验。
      # （不写 'tools/**'：那会让任何工具改动都烧这条 workflow 的额度。）
      - 'tools/check_doc_consistency.py'
      - 'tools/check_test_assertions.mjs'
      - 'tools/check_tauri_permissions.py'
      - 'tools/check_rust_error_messages.py'
      - 'tools/test_check_frontend_error_text.py'
      - 'tools/check_frontend_error_text.py'
      - 'tools/test_check_user_facing_content.py'
      - 'tools/test_check_destructive_confirm.py'
      - 'tools/test_check_test_assertions.py'
      - 'tools/test_check_source_labels.py'
      - 'tools/check_user_facing_content.py'
      - 'tools/check_destructive_confirm.py'
      - 'tools/destructive_confirm_reverse_test.py'
      - 'tools/check_test_assertions.py'
      - 'tools/check_source_labels.py'
      - 'tools/test_windows_console.py'
      - 'tools/windows_console.py'
      - 'tools/test_check_rust_error_messages.py'
      - 'tools/test_check_tauri_permissions.py'
      - 'tools/check_loopback_parity.mjs'
      - 'tools/test_check_doc_consistency.py'
      - 'tools/mcp_smoke.mjs'
      - 'tools/source_matrix_smoke.mjs'
      - 'tools/taste_usability_gate.mjs'
      - 'tools/run_all_smokes.sh'
      - 'tools/workflow_paths.py'
      - 'tools/test_workflow_paths.py'
      - 'tools/test_desktop_ci_triggers.py'
      - 'tools/workspace_ui_smoke.mjs'
      - 'tools/brain_ui_smoke.mjs'
      - 'tools/import_ui_smoke.mjs'
      - 'tools/notes_ui_smoke.mjs'
      - 'tools/mailbox_ui_smoke.mjs'
      - 'tools/review_ui_smoke.mjs'
      - 'tools/scale_ui_smoke.mjs'
      - 'tools/settings_plugins_smoke.mjs'
      - 'tools/subscriptions_ui_smoke.mjs'
      - 'tools/source_matrix_smoke.mjs'
      - 'tools/usability_journey_smoke.mjs'
      - 'tools/desktop_interaction_smoke.mjs'
      - 'tools/desktop_external_write_smoke.mjs'
      - 'tools/taste_usability_gate.mjs'
      - 'tools/mcp_smoke.mjs'
      - 'tools/mcp_server_smoke.mjs'
      - 'tools/mcp_material_search_reverse_test.mjs'
      - 'tools/mcp-server.mjs'
      - 'tools/ci_run_browser_smokes.sh'
      - '.github/workflows/android.yml'
      - '.github/workflows/workbench.yml'
  pull_request:
    paths:
      - 'apps/workbench/**'
      - 'apps/android/domain/src/jvmAndAndroidMain/kotlin/com/knowflick/app/domain/WebClipEngine.kt'
      - 'shared/assets/**'
      - 'tools/verify_workbench.sh'
      - 'tools/check_clip_parity.py'
      # 门禁实际调用的脚本——改了它们却不触发 CI，等于改完没人验。
      # （不写 'tools/**'：那会让任何工具改动都烧这条 workflow 的额度。）
      - 'tools/check_doc_consistency.py'
