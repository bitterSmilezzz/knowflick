concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-checks:
    name: 前端单测 + 类型检查 + 守卫
    runs-on: ubuntu-latest
    # 前端这半以前和 cargo test 绑在一个 job 里：Rust 编整棵 tauri 依赖树，慢的时候
    # 把「门禁过没过」的信号一起拖住（实测 2.5～20+ 分钟）。拆开后这半通常 2～4 分钟出结果。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 配置 Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/workbench/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: apps/workbench

      - name: 前端门禁（单测 + 类型检查 + 守卫）
        run: ./tools/verify_workbench.sh web

      - name: 校验剪藏规则表跨端一致
        # 前端这份 `clipEngine.ts` 与 Android 的 `WebClipEngine.kt` 服务同一篇文章，规则表必须同源。
        run: python3 tools/check_clip_parity.py

  rust-checks:
    name: Rust 单测
    runs-on: ubuntu-latest
    # 与 web-checks 分开：cargo test 要编整棵 tauri 依赖树，慢了不该连累前端那半的信号。
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/workbench
    steps:
      - uses: actions/checkout@v7

      # cargo test 在 Linux 上要 WebKitGTK 的 pkg-config 文件；不装这几包，CI 会在
      # `glib-sys` / `webkit2gtk-sys` 的 build script 上直接红，且报错离原因很远。
      # 与 workbench-release.yml 同一份清单。
      - name: 安装 Linux 系统依赖
        run: |
          # apt 的默认超时太长：源响应慢时它会一直挂着，把整个 job 拖到超时上限。
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                 -o Acquire::Retries=2 update \
               && sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                 -o Acquire::Retries=2 install -y \
                 cmake libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils; then
              echo "系统依赖安装成功（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "第 ${attempt} 次安装失败，等 15 秒再试" >&2
            sleep 15
          done
          echo "::error::安装 Linux 系统依赖失败（已重试 3 次）" >&2
          exit 1

      - name: 配置 Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/workbench/package-lock.json

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      # 不缓存的话每次都要把整棵 tauri 依赖树从零编一遍（ubuntu 上实测十几分钟）。
      # 与 workbench-release.yml 同一份写法（同一个 action、同一个 workspaces）。
      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/workbench/src-tauri -> target

      # 回环判定对照（tools/check_loopback_parity.mjs）要同时跑 Rust 与 TypeScript 两半：
      # Rust 那半用 cargo，TypeScript 那半用**已安装的** vitest（node_modules/vitest/vitest.mjs）。
      # 少这一步它会报「找不到 vitest 入口」——不是代码坏了，是依赖没装。
      - name: npm ci
        run: npm ci
        working-directory: apps/workbench

      - name: Rust 门禁
        run: ./tools/verify_workbench.sh rust
        working-directory: .
  browser-smokes:
    name: 浏览器冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 配置 Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/workbench/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: apps/workbench

      - name: 装 agent-browser（含浏览器二进制）
        # 少装浏览器二进制时，冒烟会在开页面那一步失败，报错离原因很远。
        run: |
          npm install -g agent-browser
          agent-browser install

      - name: 跑全部浏览器冒烟
        # 不用 run_all_smokes.sh：它缺 agent-browser 时 exit 0，在 CI 上会变成
        # 「什么都没跑也算成功」。这个脚本自己遍历，缺任何一套都算失败。
        run: ./tools/ci_run_browser_smokes.sh
