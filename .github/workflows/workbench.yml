      - 'tools/notes_editor_smoke.mjs'
      - 'tools/note_retrieval_smoke.mjs'
      - 'tools/creative_smoke.mjs'
      - 'tools/review_reminder_smoke.mjs'
      - 'tools/mailbox_ui_smoke.mjs'
      - 'tools/review_ui_smoke.mjs'
      - 'tools/scale_ui_smoke.mjs'
