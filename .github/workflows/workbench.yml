name: Workbench (Web + Tauri)

# ADR-0002 第一套桌面：apps/workbench 的前端单测与 Rust 壳单测。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/workbench/**'
      - 'apps/android/domain/src/jvmAndAndroidMain/kotlin/com/knowflick/app/domain/WebClipEngine.kt'
      - 'shared/assets/**'
      - 'tools/verify_workbench.sh'
      - 'tools/check_clip_parity.py'
      # 门禁实际调用的脚本——改了它们却不触发 CI，等于改完没人验。
      # （不写 'tools/**'：那会让任何工具改动都烧这条 workflow 的额度。）
      - 'tools/check_doc_consistency.py'
      - 'tools/check_loopback_parity.mjs'
      - 'tools/test_check_doc_consistency.py'
      - 'tools/mcp_smoke.mjs'
      - 'tools/source_matrix_smoke.mjs'
      - 'tools/taste_usability_gate.mjs'
      - 'tools/run_all_smokes.sh'
      - '.github/workflows/workbench.yml'
  pull_request:
    paths:
      - 'apps/workbench/**'
      - 'apps/android/domain/src/jvmAndAndroidMain/kotlin/com/knowflick/app/domain/WebClipEngine.kt'
      - 'shared/assets/**'
      - 'tools/verify_workbench.sh'
      - 'tools/check_clip_parity.py'
      # 门禁实际调用的脚本——改了它们却不触发 CI，等于改完没人验。
      # （不写 'tools/**'：那会让任何工具改动都烧这条 workflow 的额度。）
      - 'tools/check_doc_consistency.py'
      - 'tools/check_loopback_parity.mjs'
      - 'tools/test_check_doc_consistency.py'
      - 'tools/mcp_smoke.mjs'
      - 'tools/source_matrix_smoke.mjs'
      - 'tools/taste_usability_gate.mjs'
      - 'tools/run_all_smokes.sh'
      - '.github/workflows/workbench.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: npm test + cargo test
    runs-on: ubuntu-latest
    # 25 分钟不够：实测 Ubuntu runner 的 `apt-get` 偶发卡死到 25 分钟被取消
    # （2026-10-22 连续两次），而 verify 步骤本身只要 3 分钟。超时上限按
    # 「最坏情况下的 apt 也要留出余量」来定，别让环境抖动废掉整条流水线。
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/workbench
    steps:
      - uses: actions/checkout@v7

      # cargo test 会把整个 tauri 依赖树编译一遍，而它在 Linux 上要 WebKitGTK 的 pkg-config 文件；
      # 不装这几包，CI 会在 `glib-sys` / `webkit2gtk-sys` 的 build script 上直接红，且报错离原因很远。
      # 与 workbench-release.yml 同一份清单。
      - name: 安装 Linux 系统依赖
        run: |
          # apt 的默认超时太长：源响应慢时它会一直挂着，把整个 job 拖到超时上限。
          # 这里给每次 apt 调用加超时并重试——失败要快，恢复了就继续。
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                 -o Acquire::Retries=2 update \
               && sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                 -o Acquire::Retries=2 install -y \
                 cmake libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils; then
              echo "系统依赖安装成功（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "第 ${attempt} 次安装失败，等 15 秒再试" >&2
            sleep 15
          done
          echo "::error::安装 Linux 系统依赖失败（已重试 3 次）" >&2
          exit 1

      - name: 配置 Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/workbench/package-lock.json

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: npm ci
        run: npm ci

      - name: verify
        run: ./tools/verify_workbench.sh
        working-directory: .

      - name: 校验剪藏规则表跨端一致
        # 前端这份 `clipEngine.ts` 与 Android 的 `WebClipEngine.kt` 服务同一篇文章，规则表必须同源。
        run: python3 tools/check_clip_parity.py
        working-directory: .
